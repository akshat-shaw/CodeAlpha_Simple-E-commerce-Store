<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cartify — Order Placed</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="navbar" class="navbar"></header>

  <main class="container">
    <div class="empty-state">
      <h1 style="color: var(--success); margin-bottom: 1rem;">Order placed successfully!</h1>
      <p id="order-id-msg"></p>
      <a href="orders.html" class="btn" style="margin-top: 1.5rem; display:inline-block;">View My Orders</a>
      <a href="index.html" class="btn secondary" style="margin-top: 1.5rem; margin-left: 0.75rem; display:inline-block;">Continue Shopping</a>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    renderNavbar();
    const params = new URLSearchParams(window.location.search);
    document.getElementById('order-id-msg').textContent = `Order #${params.get('id')} is confirmed.`;
  </script>
</body>
</html>
