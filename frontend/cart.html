<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cartify — Cart</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="navbar" class="navbar"></header>

  <main class="container">
    <h1 style="margin-bottom: 1.5rem;">Your Cart</h1>
    <div id="cart-container">Loading...</div>
  </main>

  <script src="js/api.js"></script>
  <script>
    requireAuth();
    renderNavbar();

    async function loadCart() {
      const container = document.getElementById('cart-container');
      try {
        const { items, total } = await api('/cart');
        if (items.length === 0) {
          container.innerHTML = `<p class="empty-state">Your cart is empty. <a href="index.html">Browse products</a></p>`;
          return;
        }
        container.innerHTML = `
          <div id="cart-items">
            ${items.map(renderCartItem).join('')}
          </div>
          <div class="cart-summary">
            <div class="total-row"><span>Total</span><span>₹${total.toFixed(2)}</span></div>
            <button id="checkout-btn" class="btn btn-block">Proceed to Checkout</button>
          </div>
        `;
        attachHandlers();
        document.getElementById('checkout-btn').addEventListener('click', () => {
          window.location.href = 'checkout.html';
        });
      } catch (err) {
        container.innerHTML = `<p class="empty-state">Failed to load cart.</p>`;
      }
    }

    function renderCartItem(item) {
      return `
        <div class="cart-item" data-cart-item-id="${item.cart_item_id}">
          <img src="${item.image_url}" alt="${item.name}" />
          <div class="info">
            <h3>${item.name}</h3>
            <p>₹${item.price.toFixed(2)} each</p>
            <div class="qty-controls">
              <button class="btn secondary qty-decrease">-</button>
              <span>${item.quantity}</span>
              <button class="btn secondary qty-increase">+</button>
            </div>
          </div>
          <div>
            <p style="font-weight:700;">₹${(item.price * item.quantity).toFixed(2)}</p>
            <button class="btn danger remove-btn" style="margin-top:0.5rem;">Remove</button>
          </div>
        </div>
      `;
    }

    function attachHandlers() {
      document.querySelectorAll('.cart-item').forEach((el) => {
        const id = el.dataset.cartItemId;
        el.querySelector('.qty-increase').addEventListener('click', () =>
          changeQuantity(id, 1)
        );
        el.querySelector('.qty-decrease').addEventListener('click', () =>
          changeQuantity(id, -1)
        );
        el.querySelector('.remove-btn').addEventListener('click', () => removeItem(id));
      });
    }

    async function changeQuantity(cartItemId, delta) {
      const { items } = await api('/cart');
      const item = items.find((i) => i.cart_item_id == cartItemId);
      const newQty = item.quantity + delta;
      if (newQty < 1) return removeItem(cartItemId);
      await api(`/cart/${cartItemId}`, {
        method: 'PUT',
        body: JSON.stringify({ quantity: newQty }),
      });
      loadCart();
      updateCartCount();
    }

    async function removeItem(cartItemId) {
      await api(`/cart/${cartItemId}`, { method: 'DELETE' });
      loadCart();
      updateCartCount();
    }

    loadCart();
  </script>
</body>
</html>
