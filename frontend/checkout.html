<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cartify — Checkout</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="navbar" class="navbar"></header>

  <div class="form-card">
    <h2>Checkout</h2>
    <form id="checkout-form">
      <div class="form-group">
        <label for="shipping-name">Full name</label>
        <input type="text" id="shipping-name" required />
      </div>
      <div class="form-group">
        <label for="shipping-address">Shipping address</label>
        <textarea id="shipping-address" rows="3" required></textarea>
      </div>
      <button type="submit" class="btn btn-block">Place Order</button>
      <p id="error-msg" class="error-msg"></p>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script>
    requireAuth();
    renderNavbar();

    const user = getUser();
    if (user) document.getElementById('shipping-name').value = user.name;

    document.getElementById('checkout-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const shipping_name = document.getElementById('shipping-name').value;
      const shipping_address = document.getElementById('shipping-address').value;
      const errorMsg = document.getElementById('error-msg');
      try {
        const result = await api('/orders', {
          method: 'POST',
          body: JSON.stringify({ shipping_name, shipping_address }),
        });
        window.location.href = `order-success.html?id=${result.order_id}`;
      } catch (err) {
        errorMsg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
