<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cartify — My Orders</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="navbar" class="navbar"></header>

  <main class="container">
    <h1 style="margin-bottom: 1.5rem;">My Orders</h1>
    <div id="orders-container">Loading...</div>
  </main>

  <script src="js/api.js"></script>
  <script>
    requireAuth();
    renderNavbar();

    async function loadOrders() {
      const container = document.getElementById('orders-container');
      try {
        const orders = await api('/orders');
        if (orders.length === 0) {
          container.innerHTML = `<p class="empty-state">No orders yet. <a href="index.html">Start shopping</a></p>`;
          return;
        }
        container.innerHTML = orders.map(renderOrder).join('');
      } catch (err) {
        container.innerHTML = `<p class="empty-state">Failed to load orders.</p>`;
      }
    }

    function renderOrder(order) {
      const date = new Date(order.created_at).toLocaleDateString();
      return `
        <div class="order-card">
          <div class="order-header">
            <div>
              <strong>Order #${order.id}</strong>
              <div style="font-size:0.8rem; color:var(--muted);">${date}</div>
            </div>
            <div style="text-align:right;">
              <span class="badge">${order.status}</span>
              <div style="font-weight:700; margin-top:0.4rem;">₹${order.total.toFixed(2)}</div>
            </div>
          </div>
          <div>
            ${order.items
              .map(
                (i) => `
              <div style="display:flex; justify-content:space-between; font-size:0.9rem; padding:0.25rem 0;">
                <span>${i.name} × ${i.quantity}</span>
                <span>₹${(i.price_at_purchase * i.quantity).toFixed(2)}</span>
              </div>
            `
              )
              .join('')}
          </div>
          <div style="font-size:0.85rem; color:var(--muted); margin-top:0.75rem;">
            Shipping to: ${order.shipping_name}, ${order.shipping_address}
          </div>
        </div>
      `;
    }

    loadOrders();
  </script>
</body>
</html>
